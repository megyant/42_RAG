[project]
name = "rag"
version = "0.1.0"
description = "retrieval augmented generation"
authors = ["Margarida Antunes <mbotelho@student.42lisboa.com>"]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "uv>=0.11.21",
    "pydantic>=2.13.4",
    "fire",
    "flake8>=7.3.0",
    "flake8-pyproject",
    "mypy>=2.1.0",
    "langchain-text-splitters",
    "tqdm",
    "bm25s",
    "PyStemmer",
    "transformers",
    "torch",
    "fastapi",
    "uvicorn",
]

[tool.flake8]
extend-exclude = [
    ".venv",
    "vllm*",
    ".vscode",
    ".mypy_cache",
    "__pycache__"
]

[tool.mypy]
exclude = [
    ".venv",
    "data",
    ".vscode",
    ".mypy_cache",
    "__pycache__"
]

[[tool.mypy.overrides]]
module = [
    "bm25s",
    "bm25s.*",
    "fire",
    "tqdm",
    "transformers"
]
ignore_missing_imports = true
